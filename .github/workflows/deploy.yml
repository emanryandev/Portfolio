name: Deploy Laravel Backend to EC2

on:
  push:
    branches:
      - main
    paths:
      - 'portfolio-backend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          port: 22
          script: |
            cd ~/Portfolio
            git pull origin main
            cd portfolio-backend
            sudo docker rm -f portfolio_api || true
            sudo docker build -t portfolio-backend .
            sudo docker run -d -p 80:8000 --name portfolio_api portfolio-backend
            sleep 5
            sudo docker exec portfolio_api php artisan migrate --force
