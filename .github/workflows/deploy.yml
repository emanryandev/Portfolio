name: Deploy Laravel Backend to EC2

on:
  push:
    branches:
      - main
    paths:
      - 'portfolio-backend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd ~/Portfolio
            git pull origin main
            cd portfolio-backend
            sudo docker rm -f portfolio_api
            sudo docker build -t portfolio-backend .
            sudo docker run -d -p 80:8000 --name portfolio_api portfolio-backend
